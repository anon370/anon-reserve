<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; script-src 'self' https://octopus-app-wmb69.ondigitalocean.app; style-src 'self' https://octopus-app-wmb69.ondigitalocean.app; img-src 'self' data: https:; font-src 'self' https://octopus-app-wmb69.ondigitalocean.app; connect-src 'self' https://octopus-app-wmb69.ondigitalocean.app; base-uri 'none'; form-action 'self'; object-src 'none'">
  <title>Mi cuenta · ANON Reserva</title>
  <link rel="stylesheet" crossorigin="anonymous" href="https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/mercado.css">
  <link rel="stylesheet" href="./reserva.css">
  <link rel="stylesheet" href="./citas.css?diseno=perfil">
<link rel="manifest" href="./reserva.webmanifest"></head>
<body data-view="loading">
  <header class="booking-header">
    <div class="topbar">
      <a class="back" id="atras" href="./?vista=catalogo" aria-label="Volver al catálogo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></a>
      <a class="reserva-brand" href="./?vista=catalogo" aria-label="ANON Reserva, inicio"><img src="./anon-marca.svg" alt="ANON"><small>RESERVA</small></a>
      <a class="profile-link-top" id="perfil-enlace" hidden href="./citas.html?vista=perfil">Perfil</a>
    </div>
  </header>
  <main>
    <h1 id="page-title" hidden></h1>
    <p id="mensaje" role="status" aria-live="polite"></p>
    <div id="cuenta"></div>
    <template id="ver-clave">
      <button type="button" class="eye" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m3 3 18 18"/></svg>
      </button>
    </template>
    <div id="contenido" hidden>
      <div id="customer-profile" hidden>
        <div class="profile-id"><span id="profile-initial" aria-hidden="true"></span><strong id="profile-name"></strong></div>
        <div class="profile-heading"><h2>Próxima cita</h2><button type="button" id="show-bookings">Mis reservas →</button></div>
        <div id="next-booking" aria-live="polite">Cargando citas…</div>
      </div>
      <section id="booking-section" hidden aria-labelledby="page-title">
        <form id="reservar">
          <div class="service-card">
            <div id="service-photo"></div>
            <div class="service-copy">
              <label for="servicio" class="sr-only">Servicio</label>
              <select id="servicio" required></select>
              <p id="local"></p><p id="service-terms"></p>
            </div>
          </div>
          <div class="resource-row"><label for="recurso" id="resource-label">Profesional</label><select id="recurso" required></select></div>
          <div class="day-area">
            <div class="day-heading"><h2>Elige el día</h2><label class="month-picker"><span id="month"></span><span aria-hidden="true">⌄</span><input type="date" id="fecha" aria-label="Elegir otra fecha" required></label></div>
            <div id="dias" class="days" role="group" aria-label="Días disponibles para consultar"></div>
          </div>
          <h2 id="hours-title">Horas disponibles</h2>
          <div id="horarios" role="group" aria-labelledby="hours-title"></div>
          <button id="mas-horas" class="text-button" type="button" aria-expanded="false" aria-controls="horarios" hidden>Ver más horarios</button>
          <p id="slot-status" role="status"></p><p id="zona"></p>
          <div class="booking-foot"><div><strong id="total"></strong><button id="confirmar" type="submit" disabled>Confirmar cita</button></div></div>
        </form>
      </section>
      <div id="receipt" hidden><p id="receipt-detail"></p><a href="./citas.html?vista=perfil">Ver mis reservas</a></div>
      <div id="history" hidden>
        <details id="all-bookings"><summary>Mis reservas</summary><button id="actualizar" class="sec">Actualizar citas</button><div id="citas"></div><div id="valoraciones"></div></details>
        <h2>Mi cuenta</h2>
        <details><summary><svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9a8 8 0 0 1 16 0"/></svg>Datos personales</summary><p id="profile-email"></p><p id="profile-phone"></p></details>
        <details><summary><svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 17h16l-2-3V9a6 6 0 0 0-12 0v5Zm6 3a2 2 0 0 0 4 0"/></svg>Notificaciones <span id="unread-count"></span></summary><button type="button" id="activar-avisos">Activar notificaciones en mi teléfono</button><p id="estado-avisos" role="status"></p><div id="avisos"></div></details>
        <a class="profile-row" href="./independientes.html?vista=solicitudes"><svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18v16H3z M7 3v4m10-4v4M3 10h18"/></svg>Mis solicitudes de servicios</a>
        <details><summary><svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 5h20v14H2z M2 10h20"/></svg>Compras y transacciones</summary><div id="profile-purchases"></div></details>
        <a class="profile-row" href="https://whale-app-ebihq.ondigitalocean.app/equipo.html"><svg class="profile-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 8h20v13H2z M8 8V4h8v4 M2 13h20"/></svg>Mi trabajo y mis ingresos</a>
        <div id="manage-profiles"></div>
        <div id="profile-logout"></div>
        <nav class="reserva-dock" aria-label="Navegación principal"><a href="./?vista=catalogo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2v10.3h-6.3V14H9.3v6.5H3Z"/></svg><span>Inicio</span></a><a href="./?vista=catalogo#buscar"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.4" cy="10.4" r="7.4"/><path d="m16 16 5 5"/></svg><span>Buscar</span></a><a aria-current="page" href="./citas.html?vista=perfil"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="9" r="3"/><path d="M5.3 18c1.8-5 11.6-5 13.4 0"/></svg><span>Mi perfil</span></a></nav>
      </div>
    </div>
  </main>
  <script type="module" src="./citas.js?diseno=perfil&amp;v=resenas-negocios"></script>
</body>
</html>
