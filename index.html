    #activate-location {
      display: inline-flex; align-items: center; justify-content: center; align-self: end;

      background: #171717; color: #fff; font: inherit; font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 650; line-height: 1.15; text-align: center; cursor: pointer;
    }
    #activate-location svg { width: 17px; height: 17px; flex: none; }
    #activate-location:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
    #activate-location:active { background: #303030; }
    #activate-location:disabled { cursor: progress; }
    #filters #state-field[hidden] { display: none; }
    #location-status {grid-column:1/-1;flex-basis:100%}

    .catalog-card { display: grid; grid-template-columns: auto 1fr; align-items: start; gap: 16px; padding: 19px; }

    .catalog-card h3 { font-size: 17px; margin: 0 0 8px; line-height: 1.3; }
    .catalog-card p { font-size: 13px; color: #666; margin: 0; }
    .catalog-card h3, .catalog-card p, .category-title h3 { overflow-wrap: anywhere; }
    .category-title h3 { margin: 0; font-size: 19px; }
    .catalog-note { background: white; border: 1px solid #ddd; border-radius: 18px; padding: 26px; }
    .catalog-note p { margin: 0; }
    .catalog-note button { margin-top: 14px; }

const preference = key => { try { return localStorage.getItem(key); } catch { return null; } };
function remember(key,value) { try { localStorage.setItem(key,value); } catch {} }
const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const aliases = new Map();
const known = new Map();
for (const [key,es,en,forms] of businessCategories) {
  known.set(key,[es,en]);
  for (const form of [key,es,en,...forms]) aliases.set(normalize(form),key);

function categoryLabel(key) {

  return known.get(key)?.[language];
}
const categoryKey = value => aliases.get(normalize(value)) || 'custom:' + normalize(value);

const t = key => translations[key][language];
const initialLocation = new URLSearchParams(location.search);

function initialCountry() {
  for (const country of [initialLocation.get('country'), preference('anon.catalog.country')]) {
    if (country === 'DO' || country === 'US') return country;
  }
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';

}

el('country').value = chosenCountry === 'US' ? 'US' : 'DO';
if (chosenCountry === 'US' && ['FL','NY'].includes(initialLocation.get('state'))) {
  el('us-state').value = initialLocation.get('state');
}

  url.searchParams.set('country',el('country').value);
  for (const [key,value] of [['state',el('us-state').value],['city',el('city').value]]) {
    if (value) url.searchParams.set(key,value);

}
function groups() {
  const map = new Map();

  }
  return map;
}
function drawFilters() {

    const label = key ? categoryLabel(key) || available.get(key) || key.slice(7) : t('all');

    const btn = textNode('button',label,'chip' + (active ? ' active' : ''));

  drawLocationFilters();
  syncPickers();
}
function cityKey(value, country = el('country').value) {
  if (country === 'US') return usCatalogGeography.normalize(usCatalogGeography.cityName(value));
  return normalize(value) === 'santiago' ? 'santiago de los caballeros' : normalize(value);
}
const coverImages = [...document.querySelectorAll('#bienvenida figure img, .hero-photo img')]
  .map(img => ({img, original: img.getAttribute('src')}));
function updateCover(isUS) {
  // US photograph: National Park Service, NPGallery 3454fd91-1dd8-b71b-0b21-a93398840c35 (public domain).
  for (const {img, original} of coverImages) {
    const src = isUS ? './imagenes/estatua-libertad.webp' : original;
    if (img.getAttribute('src') !== src) img.setAttribute('src',src);
  }
  document.querySelector('#bienvenida figcaption').textContent = isUS
    ? (language ? 'Statue of Liberty, New York' : 'Estatua de la Libertad, Nueva York')
    : 'Monumento de Santiago';
}
function drawLocationFilters() {
  const country = el('country').value, isUS = country === 'US';
  const region = el('us-state').value;
  updateCover(isUS);
  el('filters').dataset.country = country;
  el('state-field').hidden = !isUS;
  el('us-state').disabled = !isUS;
  document.querySelector('[data-i18n="intro"]').textContent = t(isUS ? 'usIntro' : 'intro');
  const select = el('city'), current = initialCity || select.value;
  select.disabled = isUS && !region;
  select.replaceChildren(new Option(t(select.disabled ? 'chooseState' : 'cities'),''));
  if (select.disabled) return;
  const cities = cityOptions(country, rows.filter(row => !isUS || row.catalogState === region).map(row => row.city));
  if (isUS) {
    const popular = frequentCities[region];
    for (const [title,names] of [['popularCities',popular],['moreCities',cities.filter(name => !popular.includes(name))]]) {
      const group = document.createElement('optgroup');
      group.label = t(title);
      group.append(...names.map(name => new Option(name,name)));
      select.append(group);
    }
  } else {
    select.append(...cities.map(name => new Option(name,name)));
  }
  const match = current && cities.find(name => cityKey(name,country) === cityKey(current,country));
  if (match) { select.value = match; initialCity = ''; }
}
function cityOptions(country, values) {
  const cities = new Map();
  const common = country === 'DO'
    ? ['Santiago de los Caballeros','Santo Domingo','La Vega','Moca','Puerto Plata','San Cristóbal','San Francisco de Macorís','La Romana','Higüey','Bonao']
    : usCatalogGeography.cities[el('us-state').value] || [];
  for (const raw of [...common, ...values]) {
    const value = country === 'US' ? usCatalogGeography.cityName(raw) : raw;
    if (value?.trim() && !cities.has(cityKey(value))) cities.set(cityKey(value),value.trim());
  }
  return [...cities.values()].sort((a,b)=>a.localeCompare(b,'es'));
}
function syncPickers() {
  for (const select of document.querySelectorAll('.picker select'))
    select.nextElementSibling.textContent = select.selectedOptions[0]?.textContent || '';
}
function minimumPrice(row) {
  const prices = [...(row.services || []),...(row.products || [])]
    .filter(item=>item.price!=null && item.price!=='').map(item=>Number(item.price)).filter(Number.isFinite);
  return prices.length ? Math.min(...prices) : null;
}
function publicRating(row) { return row.rating_count > 0 ? Number(row.rating_average) : 0; }
function compareRows(a,b) {
  switch(el('sort').value) {
    case 'recommended': return Number(!!b.recommended)-Number(!!a.recommended) || publicRating(b)-publicRating(a) || (b.rating_count||0)-(a.rating_count||0);
    case 'score': return publicRating(b)-publicRating(a) || (b.rating_count||0)-(a.rating_count||0);
    case 'low':
    case 'high': {
      const left=minimumPrice(a), right=minimumPrice(b);
      if (left===null || right===null) return Number(left===null)-Number(right===null);
      return el('sort').value==='low' ? left-right : right-left;
    }
    default: return a.name.localeCompare(b.name,language?'en':'es');
  }
}
// Load the public profile photo only when its card approaches the viewport.
const photoCache = new Map();
let photoObserver;
async function showPhoto(box) {
  const id = box.dataset.business;
  let entry = photoCache.get(id);
  if (!entry || Date.now() - entry.time > 60000) {
    const request = fetch(new URL(encodeURIComponent(id)+'/',endpoint), {
      credentials:'omit', signal:AbortSignal.timeout(12000)
    }).then(async response => {
      if (!response.ok) throw Error('photo');
      return (await response.json()).profile_photo || '';
    });
    entry = {time:Date.now(),request};
    photoCache.set(id,entry);
    if (photoCache.size > 50) photoCache.delete(photoCache.keys().next().value);
  }
  try {
    const src = await entry.request;
    if (!box.isConnected || !/^data:image\/jpeg;base64,/i.test(src)) return;
    const image = document.createElement('img');
    image.alt = '';
    image.src = src;
    await image.decode();
    if (image.naturalHeight > image.naturalWidth) image.classList.add('portrait');
    box.replaceChildren(image);
  } catch {
    if (photoCache.get(id) === entry) photoCache.delete(id);
  }
}
const expandedCategories = new Set();

let searchMap, pins, area, lastFilter, origin;
function point(row) {
  const values = [row.latitude,row.longitude];
  if(values.some(v => v == null || String(v).trim()==='' || !Number.isFinite(Number(v)))) return null;
  return Math.abs(values[0])<=90 && Math.abs(values[1])<=180 ? values.map(Number) : null;
}
function syncMap(sets) {
  if(location.hash !== '#buscar') { area=null; lastFilter=null; return; }
  if(!window.L) { el('map-status').textContent=language?'Map unavailable':'Mapa no disponible'; return; }
  if(!searchMap) {
    searchMap=L.map('search-map',{scrollWheelZoom:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'origin',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(searchMap);
    pins=L.layerGroup().addTo(searchMap);
    el('map-area').onclick=()=>{area=searchMap.getBounds();drawResults();};
  }
  searchMap.invalidateSize();
  const filter=JSON.stringify([el('country').value,el('city').value,el('us-state').value,category,el('query').value,el('score').value]);
  if(filter!==lastFilter) area=null;
  let here=null;
  try {here=point(JSON.parse(sessionStorage.getItem('anon-reserva-location')) || {});}catch{}
  const bounds=[];
  pins.clearLayers();
  if(here) L.circleMarker(here,{radius:7,color:'#fff',fillColor:'#333',fillOpacity:1}).addTo(pins);
  for(const [key,list] of sets) {
    const visible=list.filter(row=>!area || !point(row) || area.contains(point(row)));
    if(!visible.length){sets.delete(key);continue;}
    if(here) {
      const distance=row=>point(row)?L.latLng(here).distanceTo(point(row)):Infinity;
      visible.sort((a,b)=>distance(a)-distance(b));
    }
    sets.set(key,visible);
    for(const row of visible) {
      const p=point(row);
      if(!p)continue;
      bounds.push(p);
      const link=document.createElement('a');
      link.textContent=row.name;
      link.href='./ficha.html?'+new URLSearchParams({negocio:row.id,country:row.country});
      L.marker(p,{title:row.name,icon:L.divIcon({className:'map-pin',html:String(bounds.length),iconSize:[30,30]})}).addTo(pins).bindPopup(link);
    }
  }
  if(!area && (lastFilter!==filter || origin!==String(here) || state==='ready' && !searchMap.hasResults && bounds.length)){
    if(here)searchMap.setView(here,13);
    else if(bounds.length)searchMap.fitBounds(bounds,{padding:[24,24],maxZoom:15});
    else searchMap.setView(el('country').value==='US'?[38,-97]:[18.95,-70.5],el('country').value==='US'?4:8);
  }
  searchMap.hasResults=bounds.length>0;
  lastFilter=filter; origin=String(here);
  el('map-status').textContent=bounds.length?'':language?'No matching pins in this area':'Sin negocios con ubicación en esta zona';
  el('map-area').textContent=language?'Search this area':'Buscar en esta zona';
}
function drawResults() {
  const container = el('business-results'), notice = el('notice');
  photoObserver?.disconnect();
  photoObserver = new IntersectionObserver(entries => {
    for (const item of entries) if (item.isIntersecting) {
      photoObserver.unobserve(item.target);
      showPhoto(item.target);
    }
  });
  notice.replaceChildren();
  container.replaceChildren();
  const query = location.hash === '#buscar' ? normalize(el('query').value) : '';
  const city = el('city').value;
  const sets = new Map(), available = groups();
  for (const row of [...rows].sort(compareRows)) {
    const key = categoryKey(row.category);
    if (el('country').value === 'US' && el('us-state').value && row.catalogState !== el('us-state').value) continue;
    const searchable = normalize([row.name,row.city,row.address,row.category,available.get(key)].join(' '));
    if ((category && category !== key) || (city && cityKey(row.city) !== cityKey(city)) || !searchable.includes(query)) continue;
    if (publicRating(row) < Number(el('score').value)) continue;
    const group = key;
    if (!sets.has(group)) sets.set(group,[]);
    sets.get(group).push(row);
  }
  syncMap(sets);
  if (state !== 'ready' || !sets.size) {
    const note = document.createElement('div');
    note.className = 'catalog-note';
    const missingScores=state==='ready' && rows.length && Number(el('score').value)>0 && !rows.some(r=>r.rating_count>0);
    note.append(textNode('p',t(missingScores ? 'noPublicScores' : state === 'loading' ? 'loading' : state === 'error' ? 'error' : !rows.length ? 'empty' : 'noMatches')));
    if (state === 'error' || (state === 'ready' && rows.length)) {
      const retry = state === 'error';
      const button = textNode('button',t(retry?'retry':'clear'),'btn secondary');
      button.onclick = retry ? () => refresh() : () => {
        category = ''; initialCity = ''; el('us-state').value = ''; el('query').value = ''; el('city').value = ''; updateLocationURL(); el('score').value='0'; el('sort').value='name'; drawFilters(); drawResults();
      };
      note.append(button);
    }
    notice.append(note);
    return;
  }
  if (['score','recommended'].includes(el('sort').value) && !rows.some(r=>r.rating_count>0)) notice.append(textNode('p',t('noPublicScores')));
  const categoryOrder = new Set([...businessCategories.map(c=>c[0]), ...sets.keys()]);
  for (const key of categoryOrder) {
    const list = sets.get(key);
    if (!list) continue;
    const section = document.createElement('section');
    section.className = 'category-section';
    const heading = document.createElement('div');
    heading.className = 'section-heading category-title';
    const label = available.get(key) || t('matches');
    heading.append(textNode('h3',label));
    const expanded = expandedCategories.has(key);
    if (list.length > 5) {
      const feminine = ['barberia','cafeteria','tienda','suplidora','ferreteria'].includes(key);
      const action = language ? 'View all' : feminine ? 'Ver todas' : 'Ver todos';
      const toggle = textNode('button',expanded ? (language?'Show less':'Ver menos') : action+' ('+list.length+')','category-toggle');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded',String(expanded));
      toggle.setAttribute('aria-label',toggle.textContent+' · '+label);
      toggle.onclick = () => {
        if (expanded) expandedCategories.delete(key);
        else expandedCategories.add(key);
        drawResults();
        [...container.querySelectorAll('.category-section')].find(node=>node.dataset.category===key)?.querySelector('button')?.focus({preventScroll:true});
      };
      heading.append(toggle);
    }
    section.dataset.category = key;
    const rail = document.createElement('div');
    rail.className = expanded ? 'category-grid' : 'business-rail';
    rail.tabIndex = 0;
    rail.setAttribute('role','region');
    rail.setAttribute('aria-label',label);
    for (const row of list) {
      const card = document.createElement(row.id ? 'a' : 'article');
      if (row.id) {
        const params = new URLSearchParams({negocio:row.id});
        if (row.country === 'US') {
          params.set('country','US');
          if (el('us-state').value) params.set('state',el('us-state').value);
          if (el('city').value) params.set('city',el('city').value);
        }
        card.href = './ficha.html?'+params;
      }
      card.className = 'business-card catalog-card';
      const initials = row.name.trim().split(/\s+/u).slice(0,2).map(word=>[...word][0]).join('').toUpperCase();
      const cover = textNode('span',initials,'cover');
      cover.setAttribute('aria-hidden','true');
      if (row.id) {
        cover.dataset.business = row.id;
        photoObserver.observe(cover);
      }
      const copy = textNode('div','','card-copy');
      copy.append(textNode('h3',row.name));
      const region = row.country==='US' ? row.catalogState || row.state_code : '';
      const place = [row.city,region].filter(Boolean).join(', ') || row.address;
      if (place) copy.append(textNode('p',place,'card-line'));
      const count = Number(row.rating_count) || 0;
      const reviews = count ? '★ '+publicRating(row).toFixed(1)+' ('+count+')' : (language?'No reviews':'Sin reseñas');
      const rating = textNode('p',reviews,'card-line');
      if (count) rating.setAttribute('aria-label',publicRating(row).toFixed(1)+(language?' out of 5, ':' de 5, ')+count+(language?' reviews':' reseñas'));
      copy.append(rating);
      const distance = window.businessDirections(row,Boolean(language),true);
      if (distance) copy.append(distance);
      if (row.id) copy.append(textNode('span',language?'View business →':'Ver negocio →','reserve-label'));
      card.append(cover,copy);
      rail.append(card);
    }
    section.append(heading,rail);
    container.append(section);
  }
}
function drawLanguage() {
  document.documentElement.lang = language ? 'en' : 'es';
  document.title = t('title');
  el('language').textContent = language ? 'ES' : 'EN';
  el('language').setAttribute('aria-label',language ? 'Español' : 'English');
  document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));
  el('categories').parentElement.setAttribute('aria-label',t('categories'));
  el('query').placeholder = t('placeholder');
  el('results-heading').textContent = t(location.hash === '#buscar' ? 'matches' : 'heading');
  drawFilters();
  drawResults();
}
async function refresh() {
  const country = el('country').value;
  if (pending?.country === country) return;
  pending?.controller.abort();
  const controller = new AbortController();
  pending = {country,controller};
  const timeout = setTimeout(()=>controller.abort(),12000);
  try {
    const read=async(path)=>{
      const url=new URL(path,location.origin);url.searchParams.set('country',country);
      const res=await fetch(url,{credentials:'omit',cache:'no-store',signal:controller.signal});
      if(!res.ok)throw Error('http');
      const data=await res.json();
      if(!Array.isArray(data.businesses))throw Error('catalog');
      return data.businesses.filter(row=>row && row.country===country && ['name','category','city','address'].every(k=>typeof row[k]==='string') && row.name.trim() && row.category.trim());
    };
    const next = await read(endpoint);
    if(pending?.controller!==controller)return;
    const nextSignature = JSON.stringify(next);
    if (state === 'ready' && nextSignature === signature) return;
    rows = country === 'US' ? next.map(row => ({...row,catalogState:usCatalogGeography.stateFor(row)})) : next;
    signature = nextSignature; state = 'ready';
  } catch {
    if (pending?.controller !== controller) return;
    rows = []; signature = null; state = 'error';
  } finally {
    clearTimeout(timeout);
    if (pending?.controller === controller) pending = null;
  }
  drawFilters(); drawResults();
}
el('language').onclick = () => {
  language = 1 - language;
  remember('anon.web.clientes.idioma',language?'en':'es'); drawLanguage();
};
el('categories').onclick = event => {
  const btn = event.target.closest('button');
  if (!btn) return;
  category = btn.dataset.key; drawFilters(); drawResults();
};
el('country').onchange = () => {
  remember('anon.catalog.country',el('country').value);
  initialCity = ''; el('us-state').value = '';
  rows = []; state = 'loading'; signature = null; category = ''; el('city').value = ''; el('query').value = '';
  updateLocationURL(); drawFilters(); drawResults(); refresh();
};
el('us-state').onchange = () => {
  initialCity = ''; el('city').value = '';
  drawLocationFilters(); syncPickers(); updateLocationURL(); drawResults();
};
el('city').onchange = () => { initialCity = ''; syncPickers(); updateLocationURL(); drawResults(); };
el('score').onchange = el('sort').onchange = drawResults;
el('all-categories').onchange = () => {
  category=el('all-categories').value;
  el('all-categories').closest('details').open=false;
  drawFilters(); drawResults();
};
new MutationObserver(()=>{if(location.hash==='#buscar')drawResults();}).observe(el('activate-location'),{attributes:true,attributeFilter:['disabled']});
el('query').oninput = drawResults;
el('filters').onsubmit = e => { e.preventDefault(); drawResults(); el('results-heading').scrollIntoView({block:'start'}); };
function showCatalogView() {
  const searching = location.hash === '#buscar';
  el('query-view').hidden = !searching;
  document.querySelector('.hero').hidden = searching;
  const active = el(searching ? 'dock-search' : 'dock-home');
  const inactive = el(searching ? 'dock-home' : 'dock-search');
  active.setAttribute('aria-current','page');
  inactive.removeAttribute('aria-current');
  el('results-heading').textContent = t(searching ? 'matches' : 'heading');

}
function navigateCatalog(event) {
  if (event.button || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  const hash = event.currentTarget.hash;
  if (location.hash !== hash) history.pushState(null,'',hash);
  showCatalogView();
  window.scrollTo(0,0);
  if (hash === '#buscar') el('query').focus({preventScroll:true});
}
el('dock-home').addEventListener('click',navigateCatalog);
el('dock-search').addEventListener('click',navigateCatalog);
el('query-view').onsubmit = event => {
  event.preventDefault();
  el('query').blur();
  el('results-heading').scrollIntoView({block:'start'});
};
document.addEventListener('DOMContentLoaded',drawResults);
window.addEventListener('hashchange',showCatalogView);
window.addEventListener('pageshow',refresh);
window.addEventListener('focus',refresh);
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) refresh(); });
setInterval(()=>{ if (!document.hidden) refresh(); },30000);
const welcome = el('bienvenida');
function enterCatalog() {
  try { sessionStorage.setItem('anon.reserva.entered','1'); } catch {}
  if (welcome.open) { welcome.close(); el(location.hash === '#buscar' ? 'query' : 'dock-home').focus({preventScroll:true}); }
}
let alreadyEntered = false;
try { alreadyEntered = sessionStorage.getItem('anon.reserva.entered') === '1'; } catch {}
if (new URLSearchParams(location.search).has('vista') || location.hash === '#buscar' || alreadyEntered) enterCatalog();
else welcome.showModal();
welcome.addEventListener('click', event => {
  if (!event.target.closest('a')) enterCatalog();
});
welcome.addEventListener('cancel', event => {event.preventDefault(); enterCatalog();});
async function syncAccount() {
  try {
    const status = await fetch(new URL('../auth/session/',endpoint),{credentials:'include',cache:'no-store'});
    if (!status.ok) return;
    if ((await status.json()).authenticated === true) enterCatalog();
  } catch { /* The public catalog remains available. */ }
}
window.addEventListener('pageshow',syncAccount);

drawLanguage();
showCatalogView();
refresh();
