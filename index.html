async function syncAccount() {
  try {
    const status = await fetch(new URL('../auth/session/',endpoint),{signal:AbortSignal.timeout(3500),credentials:'include',cache:'no-store'});
    if (!status.ok) return;
    const account = await status.json();
    if (account.authenticated) {
      enterCatalog();
      if (!changedCountry && !initialLocation.has('country') && ['US','DO'].includes(account.country) && el('country').value !== account.country) {
        el('country').value = account.country;
        el('country').onchange();
      }
    }
  } catch { /* The public catalog remains available. */ }
}
window.addEventListener('pageshow',()=>syncAccount().finally(refresh));

drawLanguage();
showCatalogView();
