let language = preference('anon.web.clientes.idioma') === 'en' ? 1 : 0;
const t = key => translations[key][language];
const countryParam = new URLSearchParams(location.search).get('country');
el('country').value = ['US','DO'].includes(countryParam) ? countryParam : preference('anon.catalog.country') === 'US' ? 'US' : 'DO';
let category = '', rows = [], state = 'loading', pending, signature = null;
function textNode(tag, value, className) {
  const node = document.createElement(tag);
  node.textContent = value;
  if (className) node.className = className;
  return node;
}
function groups() {
  const map = new Map();
  for (const row of rows) {
    const key = categoryKey(row.category);
    if (!map.has(key)) map.set(key, known.get(key)?.[language] || row.category);
  }
  return map;
}
function drawFilters() {
  const available = groups();
  const keys = [...new Set([...businessCategories.slice(0,5).map(c=>c[0]),...available.keys(),...(category?[category]:[])])];
  const buttons = [ '', ...keys ].map(key => {
    const label = key ? known.get(key)?.[language] || available.get(key) || key.slice(7) : t('all');
    const active = key === category;
    const btn = textNode('button',label,'chip' + (active ? ' active' : ''));
    btn.type = 'button';
    btn.dataset.key = key;
    btn.setAttribute('aria-pressed',String(active));
    return btn;
  });
  const focused = el('categories').contains(document.activeElement) ? document.activeElement.dataset.key : null;
  el('categories').replaceChildren(...buttons);
  if (focused != null) buttons.find(b=>b.dataset.key===focused)?.focus({preventScroll:true});
  const current = el('city').value;
  const cities = [...new Set(rows.map(row=>row.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  el('city').replaceChildren(new Option(t('cities'),''),...cities.map(c=>new Option(c,c)));
  if (cities.includes(current)) el('city').value = current;
}
function drawResults() {
  const container = el('business-results'), notice = el('notice');
  notice.replaceChildren();
  container.replaceChildren();
  const query = normalize(el('query').value), city = el('city').value;
  const sets = new Map(), available = groups();
  for (const row of rows) {
    const key = categoryKey(row.category);
    const searchable = normalize([row.name,row.city,row.address,row.category,available.get(key)].join(' '));
    if ((category && category !== key) || (city && row.city !== city) || !searchable.includes(query)) continue;
    if (!sets.has(key)) sets.set(key,[]);
    sets.get(key).push(row);
  }
  if (state !== 'ready' || !sets.size) {
    const note = document.createElement('div');
    note.className = 'catalog-note';
    note.append(textNode('p',t(state === 'loading' ? 'loading' : state === 'error' ? 'error' : !rows.length ? 'empty' : 'noMatches')));
    if (state === 'error' || (state === 'ready' && rows.length)) {
      const retry = state === 'error';
      const button = textNode('button',t(retry?'retry':'clear'),'btn secondary');
      button.onclick = retry ? () => refresh() : () => {
        category = ''; el('query').value = ''; el('city').value = ''; drawFilters(); drawResults();
      };
      note.append(button);
    }
    notice.append(note);
    return;
  }
  for (const [key,list] of sets) {
    const section = document.createElement('section');
    section.className = 'category-section';
    const heading = document.createElement('div');
    heading.className = 'section-heading category-title';
    heading.append(textNode('h3',available.get(key)),textNode('span',String(list.length),'count'));
    const rail = document.createElement('div');
    rail.className = 'business-rail';
    rail.tabIndex = 0;
    rail.setAttribute('role','region');
    rail.setAttribute('aria-label',available.get(key));
    for (const row of list) {
      const card = document.createElement('article');
      card.className = 'business-card catalog-card';
      const initials = row.name.trim().split(/\s+/u).slice(0,2).map(word=>[...word][0]).join('');
      const mark = textNode('span',initials.toUpperCase(),'avatar');
      mark.setAttribute('aria-hidden','true');
      const info = document.createElement('div');
      info.append(textNode('h3',row.name),textNode('p',row.city),textNode('p',row.address));
      const book=textNode('a',language?'Book':'Reservar','btn secondary');
      book.href='./citas.html?negocio='+encodeURIComponent(row.id);
      if(row.id) info.append(book);
      else info.append(textNode('small',language?'Directory listing · Online booking unavailable':'Directorio · Sin reservas en línea'));
      card.append(mark,info);
      rail.append(card);
    }
    section.append(heading,rail);
    container.append(section);
  }
}
function drawLanguage() {
  document.documentElement.lang = language ? 'en' : 'es';
  document.title = t('title');
  el('language').textContent = language ? 'ES' : 'EN';
  el('language').setAttribute('aria-label',language ? 'Español' : 'English');
  document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));
  el('categories').parentElement.setAttribute('aria-label',t('categories'));
  el('query').placeholder = t('placeholder');
  drawFilters();
  drawResults();
}
async function refresh() {
  const country = el('country').value;
  if (pending?.country === country) return;
  pending?.controller.abort();
  const controller = new AbortController();
  pending = {country,controller};
  const timeout = setTimeout(()=>controller.abort(),12000);
  try {
    const read=async(path)=>{
      const url=new URL(path,location.origin);url.searchParams.set('country',country);
      const res=await fetch(url,{credentials:'omit',cache:'no-store',signal:controller.signal});
      if(!res.ok)throw Error('http');
      const data=await res.json();
      if(!Array.isArray(data.businesses))throw Error('catalog');
      return data.businesses.filter(row=>row && row.country===country && ['name','category','city','address'].every(k=>typeof row[k]==='string') && row.name.trim() && row.category.trim());
    };
    const next = await read(endpoint);
    if(pending?.controller!==controller)return;
    const nextSignature = JSON.stringify(next);
    if (state === 'ready' && nextSignature === signature) return;
    rows = next; signature = nextSignature; state = 'ready';
  } catch {
    if (pending?.controller !== controller) return;
    rows = []; signature = null; state = 'error';
  } finally {
    clearTimeout(timeout);
    if (pending?.controller === controller) pending = null;
  }
  drawFilters(); drawResults();
}
el('language').onclick = () => {
  language = 1 - language;
  remember('anon.web.clientes.idioma',language?'en':'es'); drawLanguage();
};
el('categories').onclick = event => {
  const btn = event.target.closest('button');
  if (!btn) return;
  category = btn.dataset.key; drawFilters(); drawResults();
};
el('country').onchange = () => {
  remember('anon.catalog.country',el('country').value);
  if (new URLSearchParams(location.search).has('country')) {
    const url = new URL(location.href); url.searchParams.set('country',el('country').value); history.replaceState(null,'',url);
  }
  rows = []; state = 'loading'; signature = null; category = ''; el('city').value = ''; el('query').value = '';
  drawFilters(); drawResults(); refresh();
};
el('city').onchange = drawResults;
el('query').oninput = drawResults;
el('filters').onsubmit = e => { e.preventDefault(); drawResults(); el('results-heading').scrollIntoView({block:'start'}); };
window.addEventListener('pageshow',refresh);
window.addEventListener('focus',refresh);
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) refresh(); });
setInterval(()=>{ if (!document.hidden) refresh(); },30000);
drawLanguage();
refresh();
</script>
</body>
</html>
