<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/; style-src 'self' https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/; img-src 'self'; font-src https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/; connect-src 'self' https://octopus-app-wmb69.ondigitalocean.app; base-uri 'none'; form-action 'self'; object-src 'none'">
<title>Servicios independientes · ANON Reserva</title><link rel="stylesheet" crossorigin="anonymous" href="https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/mercado.css"><link rel="stylesheet" crossorigin="anonymous" href="https://octopus-app-wmb69.ondigitalocean.app/api/plataforma/ui/independientes.css"><link rel="stylesheet" href="./reserva.css"></head>
<body><header><a class="reserva-brand" href="./?vista=catalogo" aria-label="ANON Reserva, inicio"><img src="./anon-marca.svg" alt="ANON"><small>RESERVA</small></a><div class="links"><button id="perfil" class="sec">Login</button><a href="https://whale-app-ebihq.ondigitalocean.app/?registro=cuenta">¿Tienes un negocio?</a></div></header><nav class="tabs"><a href="./?vista=catalogo">Negocios</a><a href="./independientes.html" aria-current="page">Independientes</a></nav><main>
<div class="hero"><h1>Servicios independientes</h1><a href="https://whale-app-ebihq.ondigitalocean.app/?registro=independiente">＋ Publicar un servicio</a></div>
<section><form id="filtros"><div class="filtergrid"><label>País<span class="picker"><select name="country"><option value="DO">República Dominicana</option><option value="US">Estados Unidos</option></select><span class="picker-output" aria-hidden="true"></span></span></label>
<label>Ciudad<span class="picker"><select name="city"><option value="">Todas las ciudades</option></select><span class="picker-output" aria-hidden="true"></span></span></label><label class="wide">Buscar<input type="search" name="q" maxlength="120" placeholder="Nombre o descripción del servicio"></label></div>
<button type="submit" class="sr-only">Buscar servicios</button></form></section>
<div class="cat-heading"><strong>Categorías</strong><button type="button" id="todas" class="text-btn" aria-expanded="false" aria-controls="todas-categorias">Ver todas</button></div>
<div id="chips" class="chips" role="group" aria-label="Categorías"></div>
<label id="todas-categorias" hidden>Todas las categorías<select name="category" form="filtros"><option value="">Todas las categorías</option></select></label>
<div class="catalog-controls">
<label>Ordenar<select name="sort" form="filtros"><option value="">Más recientes</option><option value="recommended">Recomendados</option><option value="score">Mejor valorados</option><option value="low">Menor precio</option><option value="high">Mayor precio</option></select></label>
<label>Valoración<select name="stars" form="filtros"><option value="0">Todas</option><option value="4">4 estrellas o más</option><option value="4.5">4.5 ★ o más</option><option value="5">5 ★</option></select></label>
<label>Tarifa<select name="unit" form="filtros"><option value="">Todas las tarifas</option><option value="hora">Por hora</option><option value="visita">Por visita</option><option value="clase">Por clase</option><option value="servicio">Por servicio</option></select></label>
</div><h2>Profesionales</h2><div id="directorio"></div><button id="mas" class="sec" hidden>Ver más servicios</button>
<section id="solicitar" hidden><h2>Solicitar servicio</h2><p id="servicio-elegido"></p><form id="solicitud"><label>Teléfono para que te contacten<input name="callback" type="tel" required maxlength="25"></label><label>Mensaje opcional<textarea name="message" maxlength="600" rows="3"></textarea></label><p>El profesional recibirá tu nombre, teléfono y mensaje.</p><button type="submit">Enviar solicitud</button><button class="sec" id="cancelar" type="button">Cancelar</button></form></section>
<section id="acceso-cliente" hidden><div id="cuenta"></div><div id="contenido" hidden><h2>Mis solicitudes</h2><div id="enviadas"></div></div></section><p id="mensaje" role="status" aria-live="polite"></p></main><script type="module" src="./independientes.js"></script></body></html>
